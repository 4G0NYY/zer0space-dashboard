name: Build dashboard image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # CR_PAT (a classic PAT with write:packages) rather than GITHUB_TOKEN.
      # GITHUB_TOKEN only carries write access to packages that are linked to
      # this repository; a GHCR package created outside it — or one whose access
      # settings never got the repo added — rejects it regardless of the
      # permissions block above.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/zer0space-net/zer0space-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
