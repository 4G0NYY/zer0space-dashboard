name: Build dashboard image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'static/**'
      - 'templates/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/dashboard.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:

# Least privilege by default. Without this the token inherits the repository
# default, which on older repos is still read/write on every scope — and the
# check job below runs `pip install` against the PR's own requirements.txt,
# which executes arbitrary code from a package's build backend. The build job
# re-grants packages: write for itself.
permissions:
  contents: read

jobs:
  # Cheap guardrails. There is no test suite yet, so this is what stands between
  # a typo and a container that crash-loops on the cluster: the whole package has
  # to import, and every template has to parse.
  check:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs, not to moving major tags.
      # A tag is repointable by whoever controls the action's repository, and the
      # build job below has a long-lived PAT in its environment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q src scripts

      - name: Import the application
        # DB_HOST points nowhere on purpose — importing must not need a database.
        env:
          DB_HOST: 127.0.0.1
          SESSION_SECRET: ci-only-not-a-real-secret
        run: python -c "from src.main import app; print(f'{len(app.routes)} routes registered')"

      - name: Parse every Jinja template
        run: |
          python - <<'PY'
          from jinja2 import Environment, FileSystemLoader
          from pathlib import Path
          env = Environment(loader=FileSystemLoader("templates"))
          for path in sorted(Path("templates").glob("*.html")):
              env.get_template(path.name)
              print(f"ok  {path.name}")
          PY

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # CR_PAT (a classic PAT with write:packages) rather than GITHUB_TOKEN.
      # GITHUB_TOKEN only carries write access to packages that are linked to
      # this repository; a GHCR package created outside it — or one whose access
      # settings never got the repo added — rejects it regardless of the
      # permissions block above.
      #
      # This is a long-lived, coarse-grained credential and it is live in this
      # job's environment, which is why every action here is SHA-pinned. Better
      # still: replace it with a fine-grained PAT scoped to package write on this
      # one package, or fix the GHCR package's access settings so GITHUB_TOKEN
      # works and drop CR_PAT entirely.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/zer0space-net/zer0space-dashboard:latest
            ghcr.io/zer0space-net/zer0space-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
