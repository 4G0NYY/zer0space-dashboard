services:
  dashboard:
    image: ghcr.io/zer0space-net/zer0space-dashboard:latest
    # ── LAN port: deliberately NOT published ───────────────────────────────────────────
    # This used to publish "8080:3000". In Swarm the short syntax means mode:
    # ingress, so the dashboard answered on EVERY node's LAN address, entirely
    # bypassing the Cloudflare Tunnel. Requests arriving that way never pass
    # through Cloudflare, so cf-connecting-ip on them is whatever the caller
    # typed — which let anyone on the LAN forge a fresh source address per
    # request and walk through every per-IP rate limit, including the one
    # protecting /api/register.
    #
    # Reach the dashboard through the tunnel. If you genuinely need the LAN port
    # back, uncomment it AND narrow TRUSTED_PROXY_IPS below to the tunnel's
    # subnet only, or the rate limits go back to being advisory:
    #   ports:
    #     - "8080:3000"
    environment:
      - DOCKER_PROXY_URL=http://socketproxy:2375
      - TZ=Europe/Zurich
      # Defaults to true now. The session holds the derived vault key for
      # SESSION_MAX_AGE (24h), so this cookie is not just an auth token: whoever
      # captures it can read every stored credential. Sending it over plain HTTP
      # put it on the wire in cleartext. Set to false ONLY if you have restored
      # the plain-HTTP LAN port above and accept that trade.
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      # Host allow list. Empty disables the check. Set it to the real hostname(s)
      # so a forged Host header cannot steer the absolute stream URLs the Crimson
      # backend builds from X-Forwarded-Host.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # The dashboard's real public address. When set, this is what the Crimson
      # gateway forwards to its backend instead of the client's Host header.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Read by uvicorn itself (not by src/config.py). The image no longer passes
      # --forwarded-allow-ips '*', which had made request.client.host
      # attacker-controlled and silently defeated TRUST_PROXY=false. Leave unset
      # to keep uvicorn's safe 127.0.0.1 default; set it to the tunnel's overlay
      # subnet if you terminate X-Forwarded-For there.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
      - GLANCES_SERVICE=${GLANCES_SERVICE:-dashboard_glances}
      - GLANCES_PORT=${GLANCES_PORT:-61208}
      # ── Standalone hosts (not Swarm members) ───────────────────────────────────────────
      # Machines that run Glances but are deliberately outside the cluster, so they never
      # appear in the Docker API's /nodes and would otherwise go unmonitored — which is
      # backwards, since the database and the shared storage are the two hosts whose
      # failure takes everything else with them.
      #
      # Format: name:ip[:label]   (comma-separated; label is a free-text badge)
      # Each host needs Glances reachable on GLANCES_PORT.
      # Shown in their own "Standalone-Hosts" section and counted separately from
      # the Swarm nodes.
      - EXTRA_HOSTS=${EXTRA_HOSTS:-zs-state-01:192.168.0.16:Stateful,zs-store-01:192.168.0.15:Storage}
      # ── Admin account ──────────────────────────────────────────────────────────────────
      # There are no admin credentials here any more. On a fresh database the
      # dashboard serves a setup wizard at /setup where the first administrator is
      # created; the password is typed into a browser form, hashed with bcrypt
      # immediately, and never exists as an env var, in this file, in Portainer's
      # UI or in a shell history. /setup seals itself once that account exists.
      #
      # ── TRUST_PROXY / TRUSTED_PROXY_IPS ────────────────────────────────────────────────
      # Behind the Cloudflare Tunnel every request arrives from the tunnel
      # container, so per-IP rate limiting reads cf-connecting-ip.
      #
      # TRUST_PROXY on its own only says "read that header" — it does not say
      # "and only from the tunnel", which is why it was not sufficient. Pair it
      # with TRUSTED_PROXY_IPS: any peer outside that list is counted by its real
      # socket address no matter what header it sends.
      #
      # Empty means "no list configured" and keeps the old trust-everyone
      # behaviour, which is safe only while no LAN port is published above. Find
      # the right value with:
      #   docker network inspect cloudflared_proxy -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # and set it to that subnet alone — not to 10.0.0.0/8, which would also
      # cover the ingress gateway that LAN traffic arrives from.
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      # ── PostgreSQL (zer0space-postgres, standalone on zs-state-01) ─────────────────────
      # Either DATABASE_URL as a whole, OR the individual values below.
      # The password is NOT here — it comes from the db_password Swarm secret
      # (see `secrets:` below). DB_PASS remains only as a local-development
      # fallback and is deliberately left unset in this file.
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-192.168.0.16}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-zer0space}
      - DB_USER=${DB_USER:-dashboard}
      # ── Maintenance ────────────────────────────────────────────────────────────────────
      # Serves templates/maintenance.html for every request except /healthz and
      # /static/*. An env flag rather than a DB setting on purpose: the situation
      # you need it for is "the database is unreachable".
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      # ── zer0space ✕ Crimson gateway ────────────────────────────────────────────────────
      # Serves the Crimson Haven frontend (github.com/crimsonhaven-to) at /crimson,
      # gated on the zer0space session and reverse-proxied to these in-cluster
      # services over crimson_net. The SSO broker gives each zer0space user a real
      # Crimson account with no login screen: CRIMSON_SSO_INVITE_CODE must match the
      # backend's SIGNUP_INVITE_CODE, and the per-user identity is keyed by the
      # crimson_sso_secret Swarm secret below. Override any of these as stack env in
      # Portainer if the backend listens on a different port, etc. Leave the URLs
      # blank to turn the whole gateway off (then /crimson 404s).
      - CRIMSON_CLIENT_URL=${CRIMSON_CLIENT_URL:-http://zer0space-crimson-client:80}
      - CRIMSON_API_URL=${CRIMSON_API_URL:-http://zer0space-crimson-api:8000}
      # No default anymore; This is a live registration credential for the Crimson
      # backend, not a configuration knob: it is sent as invite_code to
      # POST /auth/register. The previous default ("zer0space") shipped in a
      # public repository, so anyone who read the repo could register accounts
      # directly against the backend and bypass this gateway entirely. That code
      # should be treated as burned and rotated on the backend. Set this as stack
      # env in Portainer, or promote it to a Swarm secret alongside the others.
      # Leave it empty and the SSO broker simply stays off (CRIMSON_SSO_ENABLED
      # is false), which degrades to shared browsing rather than failing.
      - CRIMSON_SSO_INVITE_CODE=${CRIMSON_SSO_INVITE_CODE:-}
      # ── AI assistant ───────────────────────────────────────────────────────────────────
      # Address of the zer0space-ai service below. Only the address is here:
      # the provider, the model, the API keys and the system prompt live in
      # PostgreSQL and are edited in the dashboard under Settings > AI, so
      # switching model is a dropdown and not a redeploy.
      # Blank turns the whole feature off (the chat panel hides itself and
      # /api/ai/* answers 503), so removing this line is the off switch.
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai:8000}
    secrets:
      # Read from /run/secrets/<name> by src/config.py (config.read_secret),
      # which falls back to the matching env var only when the file is absent.
      - db_password
      - session_secret
      - totp_enc_key
      - crimson_sso_secret
      # ai_service_token is shared with the ai service below and is OPT-IN.
      # Left commented out, both services fall back to a value generated once and
      # stored in the settings table, which they both read, so a first deploy
      # needs no setup at all. Creating the secret is still better, because then
      # the token never lands in the database.
      #
      # A Swarm stack fails to deploy if it references an external secret that
      # does not exist, so uncomment this line, the matching one in the ai
      # service, AND the two declarations at the bottom of this file together.
      # - ai_service_token
    volumes:
      # Central NFS storage from zs-store-01 (192.168.0.15:/srv/nfs/swarm-data),
      # mounted on every Swarm node at /mnt/storage (persistent via /etc/fstab).
      #
      # This mount is still required. The dashboard holds no database state of its
      # own (that lives on zs-state-01), but /data still holds files that are not
      # DB rows:
      #   /data/background/     uploaded background images
      #   /data/backup-status/  JSON files written per node by the backup script
      # Only once both live elsewhere can this volume be dropped.
      #
      # IMPORTANT: if /mnt/storage is NOT mounted on a node, Docker silently creates
      # the directory empty — the background image and the backup card then go missing.
      # Check on every node before deploying:
      #   mountpoint -q /mnt/storage && echo OK
      - /mnt/storage/dashboard:/data
    networks:
      - dashboard_net
      - cloudflared_proxy
      # Shared overlay to reach the Crimson client + api by their service aliases.
      # External — create it once before deploying: see the note at the bottom.
      - crimson_net
    deploy:
      # replicas MUST stay at 1. The session store is in-process memory and holds
      # the per-user vault key (src/auth.py explains why it cannot live anywhere
      # else). A second replica would serve requests that cannot see the session
      # the first one created, which reads to the user as random logouts.
      replicas: 1
      placement:
        constraints:
          # TEMPORARY: pinned next to the socketproxy while the GHCR push is being
          # sorted out, so the image can be built locally on this node and the
          # dashboard can still reach /nodes, /services and /tasks over the
          # overlay. Remove this constraint once the image is pulled from GHCR —
          # the data lives on NFS, so the service may otherwise run anywhere.
          - node.hostname == zs-node-01
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # ── AI assistant (github.com/zer0space-net/zer0space-ai) ────────────────────────────────
  # Answers questions about the cluster with its live state attached. The
  # dashboard gates it on the session and reverse-proxies it at /api/ai/*.
  #
  # Note what is NOT here: no provider, no model, no API key. All of that is
  # configured by an admin in the dashboard and stored in PostgreSQL, which is
  # the whole point. The only thing this service needs from the environment is
  # how to reach the database.
  #
  # Deliberately publishes NO ports. It does not authenticate users; it
  # authenticates the dashboard with a shared token and trusts the caller
  # identity the dashboard forwards. That is sound only while the dashboard is
  # the only thing that can reach it, so adding a `ports:` entry here or putting
  # it behind the tunnel would break the security model, not just expose a port.
  ai:
    image: ghcr.io/zer0space-net/zer0space-ai:latest
    environment:
      - TZ=Europe/Zurich
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-192.168.0.16}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-zer0space}
      - DB_USER=${DB_USER:-dashboard}
      # Conversations untouched for this long are pruned daily. 0 keeps them
      # forever, which is a slow leak into the shared database.
      - HISTORY_RETENTION_DAYS=${AI_HISTORY_RETENTION_DAYS:-90}
    secrets:
      - db_password
      # Both opt-in, same as on the dashboard above: without them the service
      # generates each value once and stores it in the settings table.
      #
      # ai_enc_key encrypts the provider API keys at rest. Rotating it makes
      # every stored key undecryptable and they have to be entered again in the
      # dashboard; there is no re-encryption path, because the plaintext exists
      # nowhere else. Treat it as close to permanent as the database password.
      # - ai_service_token
      # - ai_enc_key
    networks:
      - dashboard_net
    deploy:
      # Unlike the dashboard this genuinely scales: there is no in-process
      # session store and no local state, so any replica can answer any request.
      # A streaming answer holds a worker for as long as the model keeps
      # talking, so concurrent users are what sizes this, not request rate.
      replicas: 2
      update_config:
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
        reservations:
          cpus: '0.05'
          memory: 96M

  socketproxy:
    # Pin this. The container's whole job is to stand between an attacker and
    # host root on a manager node, and its deny behaviour is INHERITED from the
    # image's defaults rather than declared here. An untagged image resolves to
    # :latest, so a new release that adds an endpoint group or changes a default
    # would change what the Docker socket exposes with no diff in this file.
    # Replace with a digest once you have pulled a known-good one:
    #   docker image inspect tecnativa/docker-socket-proxy --format '{{index .RepoDigests 0}}'
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Only what the dashboard needs. The dangerous groups are now listed
      # explicitly rather than relying on the image defaulting them to 0 — the
      # comment already claimed they were "explicitly off", and this makes that
      # true and greppable instead of a property of some other project's code.
      - SERVICES=1
      - NODES=1
      - TASKS=1
      - CONTAINERS=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - AUTH=0
      - POST=0
      - SECRETS=0
      - CONFIGS=0
      - SWARM=0
      - EXEC=0
      - SYSTEM=0
      - INFO=0
      - PLUGINS=0
      - BUILD=0
      - COMMIT=0
      - DISTRIBUTION=0
      - SESSION=0
      - ALLOW_RESTARTS=0
    # no-new-privileges is safe to set blind. read_only: true and cap_drop: [ALL]
    # are the obvious next step but are NOT set here: this image runs HAProxy,
    # which wants a writable runtime dir and may need SETUID/SETGID to drop
    # privileges. Worth adding once someone can watch the service converge.
    security_opt:
      - no-new-privileges:true
    networks:
      - dashboard_net
    deploy:
      replicas: 1
      placement:
        constraints:
          # Stays pinned: only manager nodes answer the Swarm API endpoints
          # /nodes, /services and /tasks that the dashboard needs for the cluster
          # status. The socketproxy holds no persistent state (only the host's
          # Docker socket), so there is nothing to put on NFS here.
          - node.hostname == zs-node-01
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  glances:
    # Floating tag. Worth pinning to a release digest for the same reason as the
    # socketproxy above, especially while this service is reachable on the LAN.
    image: nicolargo/glances:latest-full
    entrypoint: ["python3", "-m", "glances", "-w"]
    hostname: "{{.Node.Hostname}}"
    # pid: host is not supported in Swarm mode — omitted.
    # CPU/RAM values still come correctly from the container namespace via /proc.
    # mode:host port → binds directly to host NIC, bypasses ingress mesh (no VXLAN needed).
    # Backend connects via Status.Addr from /nodes (LAN IP) instead of overlay IPs.
    # No overlay network — Glances is not part of dashboard_net.
    volumes:
      # The Docker socket mount is REMOVED on purpose. `:ro` on a unix socket
      # only makes the inode read-only; the Docker API behind it stays fully
      # read-write. So any code execution inside this container — a Glances or
      # dependency bug, or a bad pull of the floating image tag above — could
      # create a privileged container bind-mounting the host root filesystem.
      # With mode: global that is host root on every node in the Swarm.
      #
      # Nothing needs it: src/metrics.py only reads system, cpu, mem, fs and
      # network from Glances. It never asks for container metrics.
      - /sys:/sys:ro
      - /etc/hostname:/etc/hostname:ro
      - /etc/os-release:/etc/os-release:ro
    # ── STILL UNAUTHENTICATED — firewall this port ─────────────────────────────────────
    # `glances -w` has no --username/--password here, so anything that can reach
    # TCP/61208 on any node reads that host's full process list (argv included),
    # mounts, interfaces and users, with no credentials. mode: host binds it to
    # the host NIC on 0.0.0.0, and the two standalone hosts in EXTRA_HOSTS must
    # be running the same thing for their cards to work.
    #
    # The port cannot simply be dropped: the dashboard reaches each node at its
    # LAN address (Status.Addr from /nodes), so host-mode publishing is what
    # makes per-node metrics work at all. Until Glances auth is wired up on both
    # ends, restrict it at the firewall on every node, e.g.
    #   ufw allow from 192.168.0.0/24 to any port 61208 proto tcp
    #   ufw deny 61208
    ports:
      - target: 61208
        published: 61208
        protocol: tcp
        mode: host
    security_opt:
      - no-new-privileges:true
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M

networks:
  dashboard_net:
    driver: overlay
    driver_opts:
      # Overlay traffic is plain VXLAN on UDP/4789 unless this is set, so it
      # crosses the LAN in the clear between nodes. What rides on this network is
      # the socketproxy's Docker API responses (the whole Swarm topology).
      # Costs roughly 10% throughput and needs ESP (IP protocol 50) allowed
      # between nodes. NOTE: Docker cannot flip this on an existing network —
      # `docker network rm dashboard_net` before redeploying the stack.
      encrypted: "true"
  cloudflared_proxy:
    external: true
  # Shared with the crimson-backend + crimson-client stacks. Create once on a
  # manager BEFORE deploying (or the stack fails on the missing external network):
  #   docker network create --driver overlay --attachable crimson_net
  crimson_net:
    external: true

# All three are `external: true`, so they are created once on a manager node and
# are never part of this file — a secret defined inline would sit in the repo:
#
#   printf 'THE-DB-PASSWORD' | docker secret create db_password -
#   openssl rand -hex 32 | tr -d '\n' | docker secret create session_secret -
#   openssl rand -hex 32 | tr -d '\n' | docker secret create totp_enc_key -
#   openssl rand -hex 32 | tr -d '\n' | docker secret create crimson_sso_secret -
#
# Rotating any of them means creating a new secret under a new name and updating
# the reference: Docker secrets are immutable once created. Rotating
# session_secret invalidates every active session, so everyone has to sign in
# again — and since the vault key lives in the session, the vault re-locks until
# they do. Rotating totp_enc_key is more disruptive still: every user with 2FA
# enabled fails to decrypt their totp_secret on their next login attempt,
# indistinguishable from a wrong code, and there is no re-encryption path for
# this key the way there is for a changed password. Treat it as close to
# permanent as the database password itself.
secrets:
  db_password:
    external: true
  session_secret:
    external: true
  totp_enc_key:
    external: true
  # Keys the per-user Crimson SSO identities. Create it before deploying.
  crimson_sso_secret:
    external: true
  # Shared between the dashboard and the ai service, and OPT-IN. Declaring an
  # external secret that does not exist makes the whole stack fail to deploy, so
  # these stay commented out until you have actually created them:
  #
  #   openssl rand -hex 32 | tr -d '\n' | docker secret create ai_service_token -
  #   openssl rand -hex 32 | tr -d '\n' | docker secret create ai_enc_key -
  #
  # Then uncomment these two AND the matching lines in the dashboard and ai
  # services above. Until you do, both services generate the values on first
  # boot and store them in the settings table, which is a fully working setup.
  # ai_service_token:
  #   external: true
  # ai_enc_key:
  #   external: true
