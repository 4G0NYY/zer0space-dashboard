services:
  dashboard:
    image: ghcr.io/zer0space-net/zer0space-dashboard:latest
    ports:
      - "8080:3000"
    environment:
      - DOCKER_PROXY_URL=http://socketproxy:2375
      - TZ=Europe/Zurich
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - FORCE_HTTPS=${FORCE_HTTPS:-false}
      - GLANCES_SERVICE=${GLANCES_SERVICE:-dashboard_glances}
      - GLANCES_PORT=${GLANCES_PORT:-61208}
      # ── Standalone hosts (not Swarm members) ───────────────────────────────────────────
      # Machines that run Glances but are deliberately outside the cluster, so they never
      # appear in the Docker API's /nodes and would otherwise go unmonitored — which is
      # backwards, since the database and the shared storage are the two hosts whose
      # failure takes everything else with them.
      #
      # Format: name:ip[:label]   (comma-separated; label is a free-text badge)
      # Each host needs Glances reachable on GLANCES_PORT.
      # Shown in their own "Standalone-Hosts" section and counted separately from
      # the Swarm nodes.
      - EXTRA_HOSTS=${EXTRA_HOSTS:-zs-state-01:192.168.0.16:Stateful,zs-store-01:192.168.0.15:Storage}
      # ── Admin account ──────────────────────────────────────────────────────────────────
      # There are no admin credentials here any more. On a fresh database the
      # dashboard serves a setup wizard at /setup where the first administrator is
      # created; the password is typed into a browser form, hashed with bcrypt
      # immediately, and never exists as an env var, in this file, in Portainer's
      # UI or in a shell history. /setup seals itself once that account exists.
      #
      # ── TRUST_PROXY ────────────────────────────────────────────────────────────────────
      # Behind the Cloudflare Tunnel every request arrives from the tunnel
      # container, so per-IP rate limiting reads cf-connecting-ip. Set to false
      # ONLY if the dashboard is exposed directly, where that header would be
      # attacker-controlled and could be used to dodge the limits.
      - TRUST_PROXY=${TRUST_PROXY:-true}
      # ── PostgreSQL (zer0space-postgres, standalone on zs-state-01) ─────────────────────
      # Either DATABASE_URL as a whole, OR the individual values below.
      # The password is NOT here — it comes from the db_password Swarm secret
      # (see `secrets:` below). DB_PASS remains only as a local-development
      # fallback and is deliberately left unset in this file.
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-192.168.0.16}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-zer0space}
      - DB_USER=${DB_USER:-dashboard}
    secrets:
      # Read from /run/secrets/<name> by src/db.js and src/server.js, which fall
      # back to the matching env var only when the file is absent.
      - db_password
      - session_secret
    volumes:
      # Central NFS storage from zs-store-01 (192.168.0.15:/srv/nfs/swarm-data),
      # mounted on every Swarm node at /mnt/storage (persistent via /etc/fstab).
      #
      # This mount is still required AFTER the PostgreSQL migration. The database
      # itself is gone (services.db now lives on zs-state-01), but /data still holds
      # files that are not DB rows:
      #   /data/background/     uploaded background images
      #   /data/backup-status/  JSON files written per node by the backup script
      # Only once both live elsewhere can this volume be dropped.
      #
      # IMPORTANT: if /mnt/storage is NOT mounted on a node, Docker silently creates
      # the directory empty — the background image and the backup card then go missing.
      # Check on every node before deploying:
      #   mountpoint -q /mnt/storage && echo OK
      - /mnt/storage/dashboard:/data
    networks:
      - dashboard_net
      - cloudflared_proxy
    deploy:
      replicas: 1
      # No node.hostname pinning anymore — the data lives on NFS, so the service
      # may run on any node.
      # NOTE: the dashboard container reaches the socketproxy over the "dashboard_net"
      # overlay. The socketproxy MUST stay on a manager (only managers answer /nodes,
      # /services and /tasks). While the known VXLAN issue towards zs-worker-01/02
      # exists, the Swarm status can break if the dashboard is scheduled there.
      # Fallback in that case:
      #   placement: { constraints: [node.role == manager] }
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  socketproxy:
    image: tecnativa/docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Only what the dashboard needs — everything else explicitly off
      - SERVICES=1
      - NODES=1
      - TASKS=1
      - CONTAINERS=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - AUTH=0
      - POST=0
    networks:
      - dashboard_net
    deploy:
      replicas: 1
      placement:
        constraints:
          # Stays pinned: only manager nodes answer the Swarm API endpoints
          # /nodes, /services and /tasks that the dashboard needs for the cluster
          # status. The socketproxy holds no persistent state (only the host's
          # Docker socket), so there is nothing to put on NFS here.
          - node.hostname == zs-node-01
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 16M

  glances:
    image: nicolargo/glances:latest-full
    entrypoint: ["python3", "-m", "glances", "-w"]
    hostname: "{{.Node.Hostname}}"
    # pid: host is not supported in Swarm mode — omitted.
    # CPU/RAM values still come correctly from the container namespace via /proc.
    # mode:host port → binds directly to host NIC, bypasses ingress mesh (no VXLAN needed).
    # Backend connects via Status.Addr from /nodes (LAN IP) instead of overlay IPs.
    # No overlay network — Glances is not part of dashboard_net.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /etc/hostname:/etc/hostname:ro
      - /etc/os-release:/etc/os-release:ro
    ports:
      - target: 61208
        published: 61208
        protocol: tcp
        mode: host
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M

networks:
  dashboard_net:
    driver: overlay
  cloudflared_proxy:
    external: true

# Both are `external: true`, so they are created once on a manager node and are
# never part of this file — a secret defined inline would sit in the repo:
#
#   printf 'THE-DB-PASSWORD' | docker secret create db_password -
#   openssl rand -hex 32 | tr -d '\n' | docker secret create session_secret -
#
# Rotating either means creating a new secret under a new name and updating the
# reference: Docker secrets are immutable once created. Rotating session_secret
# invalidates every active session, so everyone has to sign in again — and since
# the vault key lives in the session, the vault re-locks until they do.
secrets:
  db_password:
    external: true
  session_secret:
    external: true
