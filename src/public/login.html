<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zer0space — Login</title>
  <!-- May, the zer0space mascot, as the tab icon. The PNGs are circular crops
       with transparent corners so the icon reads as a badge, not a black square.
       There is deliberately no <link> to favicon.svg alongside these: Firefox
       prefers an SVG icon over a PNG regardless of declaration order, so leaving
       it in would show the old mark in some browsers and May in others. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/may-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/may-64.png">
  <link rel="apple-touch-icon" href="/img/may-180.png">
  <!-- The logo is the largest element on this page and the only image; fetching
       it early keeps it from popping in after the card has animated in. -->
  <link rel="preload" as="image" href="/img/may-256.jpg">
  <style>
    :root {
      --accent:      #0a84ff;
      --accent-glow: rgba(10,132,255,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: #030304;
      color: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Starfield canvas — lowest layer */
    #star-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient glow — above stars, below card. Neutral/white, not tinted. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 60% 50% at 12% 8%, rgba(255,255,255,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 45% 45% at 90% 92%, rgba(255,255,255,0.035) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      margin: 20px;
      background: rgba(10,10,11,0.80);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 36px 32px 32px;
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
      animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      animation: logoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both, logoGlow 4s ease-in-out 0.6s infinite;
      border-radius: 50%;
    }
    /* The source image is a square with the mascot inside a blue ring; the
       circular mask drops the black corners so it sits on the card as a badge. */
    .logo-mark img {
      display: block;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.10),
        0 10px 30px rgba(0,0,0,0.55);
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      50%       { filter: drop-shadow(0 0 12px rgba(255,255,255,0.16)); }
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.38);
      margin-top: 3px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.40);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 11px;
      padding: 11px 14px;
      color: rgba(255,255,255,0.92);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .form-group input:focus {
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      background: rgba(255,255,255,0.07);
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.18); }

    /* Black button. On a near-black card the fill alone would be invisible, so
       the shape is carried by the hairline border and the drop shadow. */
    .btn {
      width: 100%;
      margin-top: 8px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 11px;
      padding: 13px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.55);
    }
    .btn:hover {
      background: #0b0b0e;
      border-color: rgba(255,255,255,0.30);
      transform: translateY(-1px);
      box-shadow: 0 8px 26px rgba(0,0,0,0.65);
    }
    .btn:active { transform: none; background: #000; }
    .btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.55);
      outline-offset: 2px;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
      box-shadow: none;
      border-color: rgba(255,255,255,0.10);
    }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255,69,58,0.12);
      border: 1px solid rgba(255,69,58,0.25);
      border-radius: 10px;
      font-size: 13px;
      color: #ff6b6b;
      text-align: center;
      display: none;
    }
    .error-msg.visible { display: block; animation: shake 0.35s ease; }

    /* Language toggle (DE / EN).
       This page does NOT load style.css — it is fully self-contained — so the
       toggle is styled here.

       It sits in the page corner rather than in the card: it is a page-level
       preference, not a login field, and inside the card it competed with the
       submit button for attention. Everything here is deliberately low-contrast
       — the earlier bright-white treatment read as the loudest thing on a page
       whose whole point is the form. */
    .lang-toggle {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 3;
      display: flex;
      height: 32px;
      padding: 3px;
      gap: 2px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0.65;
      transition: opacity 0.2s, background 0.2s, border-color 0.2s;
    }
    .lang-toggle:hover,
    .lang-toggle:focus-within {
      opacity: 1;
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
    }

    .lang-btn {
      display: flex;
      align-items: center;
      padding: 0 11px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: rgba(255,255,255,0.40);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .lang-btn:hover { color: rgba(255,255,255,0.75); }
    .lang-btn:focus-visible {
      outline: 1px solid rgba(255,255,255,0.45);
      outline-offset: 1px;
    }
    .lang-btn.active {
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.95);
    }

    /* On short viewports the fixed corner position can collide with the card. */
    @media (max-height: 560px) {
      .lang-toggle { position: static; margin: 22px auto 0; opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-5px); }
      40%       { transform: translateX(5px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }
  </style>
</head>
<body>
  <canvas id="star-canvas" aria-hidden="true"></canvas>

  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <!-- May, the zer0space mascot. Width/height are set on the tag as well
             as in CSS so the card does not reflow once the image lands. -->
        <img src="/img/may-256.jpg" width="88" height="88"
             data-i18n-alt="login.logoAlt" alt="May, das zer0space-Maskottchen">
      </div>
      <h1>zer0space</h1>
      <p data-i18n="login.subtitle">Homelab Dashboard</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username" data-i18n="login.username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="submitBtn" data-i18n="login.submit">Anmelden</button>
      <div class="error-msg" id="errorMsg" data-i18n="login.invalid">Ungültige Zugangsdaten</div>
    </form>
  </div>

  <!-- Language toggle, also available before signing in.
       It is a sibling of the card, not a child: the card's backdrop-filter makes
       it a containing block for fixed descendants, so a toggle nested inside it
       would anchor to the card instead of to the viewport corner. -->
  <div class="lang-toggle" role="group" data-i18n-aria="top.language">
    <button type="button" class="lang-btn" data-lang="de">DE</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="/i18n.js"></script>
  <script src="/login.js"></script>
  <script src="/starfield.js" defer></script>
</body>
</html>
