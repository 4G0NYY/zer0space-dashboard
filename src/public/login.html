<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zer0space — Login</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --accent:      #0a84ff;
      --accent-glow: rgba(10,132,255,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      background: #030304;
      color: rgba(255,255,255,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Starfield canvas — lowest layer */
    #star-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient glow — above stars, below card. Neutral/white, not tinted. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 60% 50% at 12% 8%, rgba(255,255,255,0.05) 0%, transparent 70%),
        radial-gradient(ellipse 45% 45% at 90% 92%, rgba(255,255,255,0.035) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 360px;
      margin: 20px;
      background: rgba(10,10,11,0.80);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 36px 32px 32px;
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
      animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      animation: logoIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both, logoGlow 4s ease-in-out 0.6s infinite;
      border-radius: 15px;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes logoGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(255,255,255,0)); }
      50%       { filter: drop-shadow(0 0 12px rgba(255,255,255,0.16)); }
    }
    .logo h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo p {
      font-size: 13px;
      color: rgba(255,255,255,0.38);
      margin-top: 3px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.40);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 11px;
      padding: 11px 14px;
      color: rgba(255,255,255,0.92);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .form-group input:focus {
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      background: rgba(255,255,255,0.07);
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.18); }

    .btn {
      width: 100%;
      margin-top: 8px;
      background: var(--accent);
      border: none;
      border-radius: 11px;
      padding: 13px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.18s, box-shadow 0.18s;
      user-select: none;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: none; opacity: 1; }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

    .error-msg {
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(255,69,58,0.12);
      border: 1px solid rgba(255,69,58,0.25);
      border-radius: 10px;
      font-size: 13px;
      color: #ff6b6b;
      text-align: center;
      display: none;
    }
    .error-msg.visible { display: block; animation: shake 0.35s ease; }

    /* Language toggle (DE / EN).
       This page does NOT load style.css — it is fully self-contained — so the
       toggle is styled here with the same literal values the inputs and button
       above use (11px radius, 0.05 surface, 0.09 border). */
    .lang-toggle {
      display: flex;
      width: fit-content;
      height: 34px;
      margin: 24px auto 0;
      padding: 3px;
      gap: 2px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 11px;
      transition: background 0.18s;
    }
    .lang-toggle:hover { background: rgba(255,255,255,0.07); }

    .lang-btn {
      display: flex;
      align-items: center;
      padding: 0 12px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: rgba(255,255,255,0.30);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, transform 0.15s;
    }
    .lang-btn:hover { color: rgba(255,255,255,0.92); }
    .lang-btn:active { transform: scale(0.94); }
    .lang-btn.active {
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-5px); }
      40%       { transform: translateX(5px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }
  </style>
</head>
<body>
  <canvas id="star-canvas" aria-hidden="true"></canvas>

  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <!--
          Logo: black rounded rectangle, white "0" centred, four-pointed stars
          in all four corners (SVG path, mathematically exact: R=3.5 outer
          radius, r=1.3 inner radius, 8 points alternating)
        -->
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none"
             xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="56" height="56" rx="15" fill="#05050d"/>
          <!-- Oben-links -->
          <path d="M9 5.5 L9.9 8.1 L12.5 9 L9.9 9.9 L9 12.5 L8.1 9.9 L5.5 9 L8.1 8.1 Z"
                fill="rgba(255,255,255,0.45)"/>
          <!-- Oben-rechts -->
          <path d="M47 5.5 L47.9 8.1 L50.5 9 L47.9 9.9 L47 12.5 L46.1 9.9 L43.5 9 L46.1 8.1 Z"
                fill="rgba(255,255,255,0.45)"/>
          <!-- Unten-links -->
          <path d="M9 43.5 L9.9 46.1 L12.5 47 L9.9 47.9 L9 50.5 L8.1 47.9 L5.5 47 L8.1 46.1 Z"
                fill="rgba(255,255,255,0.45)"/>
          <!-- Unten-rechts -->
          <path d="M47 43.5 L47.9 46.1 L50.5 47 L47.9 47.9 L47 50.5 L46.1 47.9 L43.5 47 L46.1 46.1 Z"
                fill="rgba(255,255,255,0.45)"/>
          <!-- "0" centred vertically and horizontally -->
          <text x="28" y="28" text-anchor="middle" dominant-baseline="central"
                font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif"
                font-size="28" font-weight="700" fill="white" letter-spacing="-1">0</text>
        </svg>
      </div>
      <h1>zer0space</h1>
      <p data-i18n="login.subtitle">Homelab Dashboard</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username" data-i18n="login.username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="submitBtn" data-i18n="login.submit">Anmelden</button>
      <div class="error-msg" id="errorMsg" data-i18n="login.invalid">Ungültige Zugangsdaten</div>
    </form>

    <!-- Language toggle, also available before signing in -->
    <div class="lang-toggle" role="group" data-i18n-aria="top.language">
      <button type="button" class="lang-btn" data-lang="de">DE</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <script src="/i18n.js"></script>
  <script src="/login.js"></script>
  <script>
    /* Starfield — stars drift slowly across the screen (rather than merely
       flickering) and now and then a shooting star crosses the view. */
    (function () {
      const canvas = document.getElementById('star-canvas');
      const ctx    = canvas.getContext('2d');
      let W, H, stars = [], shooting = [];

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        stars = Array.from({ length: 170 }, () => ({
          x:     Math.random() * W,
          y:     Math.random() * H,
          r:     Math.random() * 1.2 + 0.2,
          a:     Math.random() * 0.50 + 0.10,
          speed: Math.random() * 0.40 + 0.15,
          phase: Math.random() * Math.PI * 2,
          vx:    (Math.random() - 0.5) * 0.05,
          vy:    (Math.random() - 0.5) * 0.05,
        }));
      }

      function maybeSpawnShootingStar() {
        if (shooting.length < 2 && Math.random() < 0.004) {
          const x = Math.random() * W * 0.6 + W * 0.15;
          const y = Math.random() * H * 0.35;
          const angle = Math.PI * 0.2 + Math.random() * 0.18;
          shooting.push({
            x, y, angle,
            speed: 8 + Math.random() * 5,
            life: 0,
            maxLife: 35 + Math.random() * 20,
          });
        }
      }

      function draw(t) {
        ctx.clearRect(0, 0, W, H);

        stars.forEach(s => {
          s.x += s.vx; s.y += s.vy;
          if (s.x < -2) s.x = W + 2; else if (s.x > W + 2) s.x = -2;
          if (s.y < -2) s.y = H + 2; else if (s.y > H + 2) s.y = -2;
          const tw = 0.55 + 0.45 * Math.sin(t * 0.0008 * s.speed + s.phase);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${(s.a * tw).toFixed(3)})`;
          ctx.fill();
        });

        maybeSpawnShootingStar();
        shooting.forEach(s => {
          s.life++;
          const dx = Math.cos(s.angle) * s.speed;
          const dy = Math.sin(s.angle) * s.speed;
          s.x += dx; s.y += dy;
          const fade = Math.max(0, 1 - s.life / s.maxLife);
          const grad = ctx.createLinearGradient(s.x, s.y, s.x - dx * 5, s.y - dy * 5);
          grad.addColorStop(0, `rgba(255,255,255,${(fade * 0.85).toFixed(3)})`);
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - dx * 5, s.y - dy * 5);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.3;
          ctx.lineCap = 'round';
          ctx.stroke();
        });
        shooting = shooting.filter(s => s.life < s.maxLife && s.x < W + 60 && s.y < H + 60);

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
