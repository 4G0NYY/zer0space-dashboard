<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zer0space — Login</title>
  <!-- Tab icon: the zer0space logo mark. The source is drawn on an opaque white
       background, so src/public/img/logo-*.png are keyed to transparency and
       cropped to the mark — a white tile would otherwise sit in the tab strip.
       Deliberately no <link> to an SVG alongside these: Firefox prefers an SVG
       icon over a PNG regardless of declaration order, which would show two
       different icons depending on the browser. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo-64.png">
  <link rel="apple-touch-icon" href="/img/logo-180.png">
  <!-- The logo is the largest element on this page and the only image; fetching
       it early keeps it from popping in after the card has animated in. -->
  <link rel="preload" as="image" href="/img/may-256.jpg">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <canvas id="star-canvas" aria-hidden="true"></canvas>

  <div class="card">
    <div class="logo">
      <div class="logo-mark">
        <!-- May, the zer0space mascot. Width/height are set on the tag as well
             as in CSS so the card does not reflow once the image lands. -->
        <img src="/img/may-256.jpg" width="88" height="88"
             data-i18n-alt="login.logoAlt" alt="May, das zer0space-Maskottchen">
      </div>
      <h1>zer0space</h1>
      <p data-i18n="login.subtitle">Homelab Dashboard</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username" data-i18n="login.username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="admin" required autofocus>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="login.password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="submitBtn" data-i18n="login.submit">Anmelden</button>
      <div class="error-msg" id="errorMsg" data-i18n="login.invalid">Ungültige Zugangsdaten</div>
      <!-- Shown after arriving back from a successful registration. -->
      <div class="success-msg" id="registeredMsg" data-i18n="login.registered">Konto erstellt — du kannst dich jetzt anmelden.</div>
    </form>

    <!-- Without this the registration page is unreachable for anyone who was
         sent a bare code rather than a full /register?code=… link. -->
    <div class="card-footer">
      <a href="/register" class="link-quiet" data-i18n="login.haveInvite">Einladungscode einlösen</a>
    </div>
  </div>

  <!-- Language toggle, also available before signing in.
       It is a sibling of the card, not a child: the card's backdrop-filter makes
       it a containing block for fixed descendants, so a toggle nested inside it
       would anchor to the card instead of to the viewport corner. -->
  <div class="lang-toggle" role="group" data-i18n-aria="top.language">
    <button type="button" class="lang-btn" data-lang="de">DE</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="/i18n.js"></script>
  <script src="/login.js"></script>
  <script src="/starfield.js" defer></script>
</body>
</html>
