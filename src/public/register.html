<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zer0space — Registrierung</title>
  <!-- Tab icon: the zer0space logo mark. The source is drawn on an opaque white
       background, so src/public/img/logo-*.png are keyed to transparency and
       cropped to the mark — a white tile would otherwise sit in the tab strip.
       Deliberately no <link> to an SVG alongside these: Firefox prefers an SVG
       icon over a PNG regardless of declaration order, which would show two
       different icons depending on the browser. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo-64.png">
  <link rel="apple-touch-icon" href="/img/logo-180.png">
  <link rel="preload" as="image" href="/img/may-256.jpg">
  <!-- The invite code arrives as a query parameter, so keep it out of any
       Referer sent to a third party. -->
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <canvas id="star-canvas" aria-hidden="true"></canvas>

  <div class="card card--wide">
    <div class="logo">
      <div class="logo-mark">
        <img src="/img/may-256.jpg" width="88" height="88"
             data-i18n-alt="login.logoAlt" alt="May, das zer0space-Maskottchen">
      </div>
      <h1 data-i18n="register.title">Konto erstellen</h1>
      <p data-i18n="register.subtitle">Mit Einladungscode</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="code" data-i18n="register.code">Einladungscode</label>
        <input id="code" name="code" type="text" autocomplete="off" spellcheck="false"
               placeholder="32 Zeichen" required>
      </div>

      <div class="form-group">
        <label for="username" data-i18n="login.username">Benutzername</label>
        <input id="username" name="username" type="text" autocomplete="username"
               placeholder="name" required>
        <p class="field-hint" data-i18n="setup.usernameHint">3–32 Zeichen: Buchstaben, Ziffern, Punkt, Unterstrich, Bindestrich.</p>
      </div>

      <div class="form-group">
        <label for="password" data-i18n="login.password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               placeholder="••••••••••••" required>
        <div class="strength">
          <div class="strength-track" aria-hidden="true">
            <div class="strength-seg"></div>
            <div class="strength-seg"></div>
            <div class="strength-seg"></div>
            <div class="strength-seg"></div>
          </div>
          <div class="strength-label" id="strengthLabel" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="password2" data-i18n="setup.confirm">Passwort bestätigen</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password"
               placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn" id="submitBtn" data-i18n="register.submit">Konto erstellen</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg" data-i18n="register.done">Konto erstellt — du wirst zur Anmeldung weitergeleitet …</div>
    </form>
  </div>

  <div class="lang-toggle" role="group" data-i18n-aria="top.language">
    <button type="button" class="lang-btn" data-lang="de">DE</button>
    <button type="button" class="lang-btn" data-lang="en">EN</button>
  </div>

  <script src="/i18n.js"></script>
  <script src="/password-strength.js"></script>
  <script src="/register.js"></script>
  <script src="/starfield.js" defer></script>
</body>
</html>
